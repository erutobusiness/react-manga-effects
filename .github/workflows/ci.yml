name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # TypeScript 7 runs alongside TS 6 (see package.json). typescript-eslint
      # cannot use TS 7 yet — it has no compiler API — so TS 6 stays primary and
      # this step checks the code against the next compiler.
      - run: npm run typecheck:next

      # Storybook is the only place several props are exercised, and it broke
      # silently across the 8 -> 10 upgrade until it was built by hand.
      - run: npm run build-storybook
